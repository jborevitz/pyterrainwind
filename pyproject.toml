[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyterrainwind"
version = "0.1.0"
description = "Terrain wind exposure (Sx, MicroMet) and Penman-Monteith reference ET"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "scipy>=1.10", "pyterrainsol>=0.2"]

[project.optional-dependencies]
test = ["pytest>=7", "pandas>=2.0", "rasterio>=1.3"]

[tool.setuptools.packages.find]
include = ["pyterrainwind*"]
